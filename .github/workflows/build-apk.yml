name: Build Textile CAD Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate PNG App Icon
        run: |
          python3 - << 'EOF'
          import os, struct, zlib
          os.makedirs("app/src/main/res/mipmap-xxxhdpi", exist_ok=True)
          w, h = 192, 192
          def chunk(tag, data):
              return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  dx, dy = abs(x - 96), abs(y - 96)
                  if dx < 56 and dy < 56 and ((x // 16 + y // 16) % 2 == 0):
                      raw.extend((204, 255, 0, 255))
                  elif dx < 64 and dy < 64:
                      raw.extend((24, 24, 30, 255))
                  else:
                      raw.extend((14, 14, 20, 255))
          ihdr = struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")
          with open("app/src/main/res/mipmap-xxxhdpi/ic_launcher.png", "wb") as f:
              f.write(png)
          EOF

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias cadpro \
            -storepass cadpro1234 \
            -keypass cadpro1234 \
            -dname "CN=TextileCADPro, OU=CAD, O=Sanganer, C=IN"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Textile-CAD-Pro-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
